name: CI

on:
  push:
    branches: [main, feat/*, fix/*, chore/*]
  pull_request:
    branches: [main]

jobs:
  # ── API type-check & build ───────────────────────────────────────────────────
  api:
    name: API — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: npm ci

      - name: Verify native binaries
        run: |
          echo "Verifying rollup installation..."
          npm ls rollup || echo "Warning: rollup check failed"
          echo "Verifying esbuild installation..."
          npm ls esbuild || echo "Warning: esbuild check failed"

      - name: Type-check (lint)
        run: npm run lint --workspace=apps/api

      - name: Build
        run: npm run build --workspace=apps/api

  # ── Frontend type-check & build ──────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify native binaries (Rollup, LightningCSS)
        run: |
          echo "Verifying rollup installation..."
          npm ls rollup || echo "Warning: rollup check failed"
          echo "Verifying lightningcss installation..."
          npm ls lightningcss || echo "Warning: lightningcss check failed"

      - name: Type-check (lint)
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:4000

  # ── Widget SDK lint & build ───────────────────────────────────────────────────
  widget-sdk:
    name: Widget SDK — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: npm ci

      - name: Verify native binaries
        run: |
          echo "Verifying esbuild installation..."
          npm ls esbuild || echo "Warning: esbuild check failed"

      - name: Lint
        run: npm run lint --workspace=packages/widget-sdk

      - name: Build
        run: npm run build --workspace=packages/widget-sdk
